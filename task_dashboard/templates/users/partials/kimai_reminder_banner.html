{% load i18n %}
{% if kimai_reminder %}
  <div class="alert alert-warning flex items-center gap-3 rounded-none border-x-0 border-t-0"
       role="alert">
    <svg xmlns="http://www.w3.org/2000/svg"
         class="h-5 w-5 shrink-0"
         fill="none"
         viewBox="0 0 24 24"
         stroke="currentColor">
      <path stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
    </svg>
    <span>
      {% blocktrans trimmed with days=kimai_reminder.days_behind %}
        You are <strong>{{ days }} business day{{ days|pluralize }}</strong> behind on time tracking in Kimai.
      {% endblocktrans %}
    </span>
    {% if kimai_reminder.kimai_url %}
      <a href="{{ kimai_reminder.kimai_url }}"
         target="_blank"
         rel="noopener noreferrer"
         class="btn btn-sm btn-warning btn-outline ml-auto whitespace-nowrap">
        {% trans "Book now" %}
        <svg xmlns="http://www.w3.org/2000/svg"
             class="h-4 w-4"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
        </svg>
      </a>
    {% endif %}
  </div>
{% endif %}
